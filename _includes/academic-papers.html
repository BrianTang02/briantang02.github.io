<div class="paper-list">
  {% for paper in site.data.academic.papers %}
  <article class="paper">
    <div class="paper-meta"><span class="venue">{{ paper.venue }}</span><span>{{ paper.date }}</span></div>
    <h3><a href="{{ paper.url }}">{{ paper.title }}</a></h3>
    <p class="paper-authors">{{ paper.authors }}</p>
    <p class="paper-summary">{{ paper.summary }}</p>
    <a class="text-link" href="{{ paper.url }}">{{ paper.link_label }} <span aria-hidden="true">↗</span></a>
  </article>
  {% endfor %}
</div>
